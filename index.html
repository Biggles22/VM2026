<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VM 2026</title>
<script>
  const DESKTOP_URL = "tips8.html?v=24";
  const MOBILE_URL = "landing-mobile.html?v=6";
  const params = new URLSearchParams(window.location.search);
  const forcedView = params.get("view");
  const looksMobile = window.matchMedia("(max-width: 820px)").matches ||
    /Android|iPhone|iPad|iPod|IEMobile|Opera Mini/i.test(navigator.userAgent);

  if (forcedView === "mobile") {
    window.location.replace(MOBILE_URL);
  } else if (forcedView === "desktop") {
    window.location.replace(DESKTOP_URL);
  } else {
    window.location.replace(looksMobile ? MOBILE_URL : DESKTOP_URL);
  }
</script>
</head>
<body>
<p>Skickar dig vidare till rätt version av VM 2026-sidan...</p>
<p><a href="tips8.html?v=17">Vanlig sida</a> | <a href="landing-mobile.html?v=6">Mobilsida</a></p>
</body>
</html>
