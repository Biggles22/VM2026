<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VM 2026 Golden Boot</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7fb;
            color: #102a43;
        }
        header {
            background: #0f4c81;
            color: #ffffff;
            padding: 22px 18px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: clamp(2rem, 3vw, 2.6rem);
            letter-spacing: -0.04em;
        }
        .container {
            max-width: 1100px;
            margin: 24px auto;
            padding: 0 18px 40px;
        }
        .status-box {
            display: inline-flex;
            align-items: center;
            padding: 12px 14px;
            border-radius: 14px;
            background: #e2e8f0;
            color: #102a43;
            font-size: 0.95rem;
            margin-bottom: 18px;
        }
        .note {
            margin-bottom: 18px;
            padding: 16px 18px;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #dbe3ea;
            color: #334e68;
            line-height: 1.6;
        }
        .rule-note {
            margin: 0 0 18px;
            padding: 14px 16px;
            border-radius: 8px;
            background: #ffffff;
            border: 1px solid #dbe3ea;
            color: #334e68;
            line-height: 1.55;
        }
        .rule-note strong {
            color: #0f4c81;
        }
        .rule-note a {
            color: #0f4c81;
            font-weight: 700;
            text-decoration: none;
        }
        .rule-note a:hover {
            text-decoration: underline;
        }
        .topscorers-table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 18px 40px rgba(16, 42, 67, 0.08);
        }
        .topscorers-table thead {
            background: linear-gradient(90deg, #0f4c81, #2566a8);
            color: #ffffff;
        }
        .topscorers-table th,
        .topscorers-table td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #e1e8f0;
            font-size: 0.95rem;
        }
        .topscorers-table tbody tr:nth-child(even) {
            background: #f4f7fb;
        }
        .topscorers-table td.rank {
            width: 60px;
            font-weight: 700;
            color: #0f4c81;
        }
        .player-name {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .player-team {
            color: #4a6d87;
            font-size: 0.9rem;
        }
        .loading,
        .error {
            padding: 18px;
            border-radius: 16px;
            margin-top: 12px;
        }
        .loading {
            background: #ffffff;
            border: 1px solid #dbe3ea;
            color: #334e68;
        }
        .error {
            background: #ffe0e0;
            border: 1px solid #fecaca;
            color: #9f1239;
        }
        @media (max-width: 760px) {
            .topscorers-table th,
            .topscorers-table td {
                padding: 12px 10px;
            }
        }

    .mobile-bottom-nav {
      display: none;
    }

    @media (max-width: 820px) {
      body {
        padding-bottom: calc(78px + env(safe-area-inset-bottom));
      }

      .mobile-bottom-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1000;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
        background: rgba(255, 255, 255, 0.96);
        border-top: 1px solid rgba(15, 44, 69, 0.12);
        box-shadow: 0 -14px 30px rgba(15, 44, 69, 0.12);
      }

      .mobile-bottom-nav a {
        min-height: 48px;
        display: grid;
        place-items: center;
        color: #244761;
        font-size: 0.78rem;
        font-weight: 900;
        text-decoration: none;
        border-radius: 8px;
        background: #eef4fb;
      }
    }

  </style>
</head>
<body>
    <header>
        <h1>VM 2026 - Golden Boot</h1>
    </header>
    <div class="container">
 
        <div class="status-box" id="status">Laddar toppskyttar...</div>
        <div class="rule-note">
            <strong>Golden Boot-sortering:</strong> flest mål, därefter flest assist, därefter färre spelade minuter.
            Samma logik som FIFA:s <a id="officialGoldenBootLink" href="https://www.fifa.com/en/tournaments/mens/worldcup/canadamexicousa2026/articles/adidas-golden-boot-race-top-scorer" target="_blank" rel="noopener noreferrer">officiella Golden Boot-race</a>.
        </div>
        <div id="topscorers">
            <div class="loading">Hämtar data från API...</div>
        </div>
    </div>
    <script>
        const API_KEY = "170d2afb853fb860d9432d14d7eaaaa5"; // ⚠️ Byt ut mot din API-nyckel från api-football.com
        const BASE_URL = "https://v3.football.api-sports.io";
        const FOOTBALL_TOPSCORERS_PROXY_URL = "https://vm2026-worker.anders-h-engstrom.workers.dev/api/football/topscorers";
        const LEAGUE = 1;
        const SEASON = 2026;
        const MAX_PLAYERS = 20;
        const OFFICIAL_GOLDEN_BOOT_URL = "https://www.fifa.com/en/tournaments/mens/worldcup/canadamexicousa2026/articles/adidas-golden-boot-race-top-scorer";
        const FIFA_GOLDEN_BOOT_ARTICLE_ENDPOINT = "https://cxm-api.fifa.com/fifaplusweb/api/sections/article/6z1agAwt7pwNgagXvawwK7?locale=en";
        const FIFA_REFRESH_INTERVAL_MS = 10 * 60 * 1000;
        const FINISHED_STATUSES = new Set(["FT", "AET", "PEN"]);
        const FALLBACK_GOLDEN_BOOT_PLAYERS = [
            createOfficialGoldenBootEntry("Lionel Messi", "Argentina", 8),
            createOfficialGoldenBootEntry("Kylian Mbappé", "France", 8, 2),
            createOfficialGoldenBootEntry("Erling Haaland", "Norway", 7),
            createOfficialGoldenBootEntry("Harry Kane", "England", 6),
            createOfficialGoldenBootEntry("Jude Bellingham", "England", 6)
        ];

        async function apiFootball(endpoint) {
            const response = await fetch(`${BASE_URL}/${endpoint}`, {
                cache: "no-store",
                headers: {
                    "x-apisports-key": API_KEY
                }
            });
            if (!response.ok) {
                const text = await response.text();
                throw new Error(`API-fel ${response.status}: ${response.statusText} ${text}`);
            }
            const data = await response.json();
            if (data.errors && Object.keys(data.errors).length) {
                throw new Error(`API-fel: ${JSON.stringify(data.errors)}`);
            }
            return data;
        }

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char]));
        }

        function personKey(person, team) {
            return String(person.id || `${person.name || ""}-${team.id || team.name || ""}`).toLowerCase();
        }

        function normalizeKey(value) {
            return String(value ?? "")
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9]+/g, " ")
                .trim();
        }

        function createPlayerEntry(player, team) {
            return {
                player: {
                    id: player.id,
                    name: player.name || "-"
                },
                team: {
                    id: team.id,
                    name: team.name || "-"
                },
                statistics: [{
                    games: { scoringMatches: 0, minutes: 0, hasMinutes: false },
                    goals: { total: 0, assists: 0 },
                    penalties: { total: 0 },
                    fixtureIds: new Set(),
                    minutesFixtureIds: new Set()
                }]
            };
        }

        function createOfficialGoldenBootEntry(name, country, goals, assists = null, minutes = 0) {
            const knownAssists = Number(assists);
            const knownMinutes = Number(minutes);
            const hasAssists = Number.isFinite(knownAssists);
            const hasMinutes = Number.isFinite(knownMinutes) && knownMinutes > 0;
            return {
                player: { name, nationality: country },
                team: { name: country },
                statistics: [{
                    games: { minutes: hasMinutes ? knownMinutes : 0, hasMinutes },
                    goals: { total: goals, assists: hasAssists ? knownAssists : null },
                    penalties: { total: null },
                    source: "FIFA"
                }]
            };
        }

        async function loadTopscorersFromFifaStats() {
            const response = await fetch(`${FOOTBALL_TOPSCORERS_PROXY_URL}?_=${Date.now()}`, { cache: "no-store" });
            if (!response.ok) {
                const text = await response.text();
                throw new Error(`Worker-fel ${response.status}: ${response.statusText} ${text}`);
            }

            const data = await response.json();
            const players = (data.response || [])
                .filter(player => (player.statistics?.[0]?.goals?.total ?? 0) > 0);
            if (!players.length) throw new Error("FIFA:s skytteliga saknar spelare.");

            return normalizeTopscorers(players);
        }

        async function fifaContent(endpoint) {
            const response = await fetch(endpoint, { cache: "no-store" });
            if (!response.ok) {
                const text = await response.text();
                throw new Error(`FIFA-fel ${response.status}: ${response.statusText} ${text}`);
            }
            return response.json();
        }

        async function loadFinishedFixtures() {
            const data = await apiFootball(`fixtures?league=${LEAGUE}&season=${SEASON}`);
            return (data.response || []).filter(match =>
                FINISHED_STATUSES.has(match.fixture?.status?.short)
            );
        }

        async function mapWithConcurrency(items, limit, worker) {
            const queue = [...items];
            const workers = Array.from({ length: Math.min(limit, queue.length) }, async () => {
                while (queue.length) {
                    const item = queue.shift();
                    await worker(item);
                }
            });
            await Promise.all(workers);
        }

        function addPlayerMinutes(entries, fixtureId, team, player, playerStats) {
            if (!player?.name) return;

            const key = personKey(player, team);
            if (!entries.has(key)) {
                entries.set(key, createPlayerEntry(player, team));
            }

            const stats = entries.get(key).statistics[0];
            if (stats.minutesFixtureIds.has(fixtureId)) return;

            const minutes = Number(playerStats.games?.minutes);
            if (Number.isFinite(minutes) && minutes > 0) {
                stats.games.minutes += minutes;
                stats.games.hasMinutes = true;
            }
            stats.minutesFixtureIds.add(fixtureId);
        }

        function addGoalEvent(entries, fixtureId, event) {
            const detail = String(event.detail || "");
            const ignoredGoalDetails = ["Missed Penalty", "Own Goal", "Cancelled goal", "Penalty Shootout"];
            if (event.type !== "Goal" || ignoredGoalDetails.includes(detail) || detail.toLowerCase().includes("shootout")) return;

            const player = event.player || {};
            const team = event.team || {};
            if (!player.name) return;

            const key = personKey(player, team);
            if (!entries.has(key)) {
                entries.set(key, createPlayerEntry(player, team));
            }

            const stats = entries.get(key).statistics[0];
            stats.goals.total += 1;
            stats.fixtureIds.add(fixtureId);
            stats.games.scoringMatches = stats.fixtureIds.size;
            if (event.detail === "Penalty") {
                stats.penalties.total += 1;
            }

            const assist = event.assist || {};
            if (assist.name) {
                const assistKey = personKey(assist, team);
                if (!entries.has(assistKey)) {
                    entries.set(assistKey, createPlayerEntry(assist, team));
                }
                const assistStats = entries.get(assistKey).statistics[0];
                assistStats.goals.assists += 1;
            }
        }

        async function addFixturePlayerStatistics(entries, match) {
            const data = await apiFootball(`fixtures/players?fixture=${match.fixture.id}`);
            (data.response || []).forEach(teamStats => {
                const team = teamStats.team || {};
                (teamStats.players || []).forEach(item => {
                    addPlayerMinutes(entries, match.fixture.id, team, item.player || {}, item.statistics?.[0] || {});
                });
            });
        }

        async function addFixtureEvents(entries, match) {
            const data = await apiFootball(`fixtures/events?fixture=${match.fixture.id}`);
            (data.response || []).forEach(event => {
                addGoalEvent(entries, match.fixture.id, event);
            });
        }

        async function loadTopscorersFromEvents(fixtures) {
            const entries = new Map();

            await mapWithConcurrency(fixtures, 2, async match => {
                const [playerStatsResult, eventsResult] = await Promise.allSettled([
                    addFixturePlayerStatistics(entries, match),
                    addFixtureEvents(entries, match)
                ]);

                if (playerStatsResult.status === "rejected") {
                    console.warn(`Kunde inte hämta spelarstatistik för match ${match.fixture.id}:`, playerStatsResult.reason);
                }
                if (eventsResult.status === "rejected") {
                    console.warn(`Kunde inte hämta mål-events för match ${match.fixture.id}:`, eventsResult.reason);
                }
            });

            return normalizeTopscorers(Array.from(entries.values()).filter(item =>
                (item.statistics?.[0]?.goals?.total ?? 0) > 0
            ));
        }

        async function loadTopscorersFromApi() {
            const response = await fetch(`${FOOTBALL_TOPSCORERS_PROXY_URL}?_=${Date.now()}`, { cache: "no-store" });
            if (!response.ok) {
                const text = await response.text();
                throw new Error(`Worker-fel ${response.status}: ${response.statusText} ${text}`);
            }
            const data = await response.json();
            return data.response || [];
        }

        function compareByGoldenBootRules(a, b) {
            const aStats = a.statistics?.[0] || {};
            const bStats = b.statistics?.[0] || {};
            const goalDiff = (bStats.goals?.total ?? 0) - (aStats.goals?.total ?? 0);
            if (goalDiff) return goalDiff;
            const assistDiff = (bStats.goals?.assists ?? 0) - (aStats.goals?.assists ?? 0);
            if (assistDiff) return assistDiff;
            const minutesDiff = knownMinutes(aStats) - knownMinutes(bStats);
            if (minutesDiff) return minutesDiff;
            return (a.player?.name || "").localeCompare(b.player?.name || "", "sv");
        }

        function normalizeTopscorers(players) {
            return players.sort(compareByGoldenBootRules);
        }

        function knownMinutes(statistics) {
            const minutes = Number(statistics.games?.minutes);
            return Number.isFinite(minutes) && minutes > 0
                ? minutes
                : Number.MAX_SAFE_INTEGER;
        }

        function configureOfficialLink() {
            const link = document.getElementById("officialGoldenBootLink");
            if (link) link.href = OFFICIAL_GOLDEN_BOOT_URL;
        }

        function richTextToText(node) {
            if (!node) return "";
            if (node.nodeType === "text") return node.value || "";
            return (node.content || []).map(richTextToText).join("");
        }

        function numberTextToValue(value) {
            const normalized = String(value || "")
                .toLowerCase()
                .replace(/(\d+)(?:st|nd|rd|th)$/i, "$1");
            const numberWords = {
                zero: 0,
                one: 1,
                first: 1,
                two: 2,
                second: 2,
                three: 3,
                third: 3,
                four: 4,
                fourth: 4,
                five: 5,
                fifth: 5,
                six: 6,
                sixth: 6,
                seven: 7,
                seventh: 7,
                eight: 8,
                eighth: 8,
                nine: 9,
                ninth: 9,
                ten: 10,
                tenth: 10
            };
            if (numberWords[normalized] !== undefined) return numberWords[normalized];
            const number = Number(normalized);
            return Number.isFinite(number) ? number : null;
        }

        function goalsFromHeading(value) {
            const normalized = String(value || "").toLowerCase();
            const digitMatch = normalized.match(/(\d+)\s+goals?/);
            if (digitMatch) return Number(digitMatch[1]);
            const wordMatch = normalized.match(/\b(one|two|three|four|five|six|seven|eight|nine|ten)\s+goals?\b/);
            return wordMatch ? numberTextToValue(wordMatch[1]) : null;
        }

        function parseAssistCount(value) {
            const normalized = String(value || "").toLowerCase();
            return numberTextToValue(normalized) ?? 0;
        }

        function parseGoldenBootLine(line, goals) {
            const match = String(line || "").trim().match(/^(.+?)\s*\((.+?)\)\s*[-–]\s*(.+?)\s+assists?,\s*(\d+)\s+minutes?\s+played/i);
            if (!match || !Number.isFinite(goals)) return null;
            return createOfficialGoldenBootEntry(
                match[1].trim(),
                match[2].trim(),
                goals,
                parseAssistCount(match[3]),
                Number(match[4])
            );
        }

        function parseOfficialLeadPlayers(content) {
            const text = content
                .map(richTextToText)
                .join(" ")
                .replace(/\s+/g, " ")
                .trim();
            const players = new Map();
            const countryPattern = "(Argentina|France|Norway|England)";
            const namePattern = "([A-ZÀ-Ý][A-Za-zÀ-ÿ'’-]+(?:\\s+[A-ZÀ-Ý][A-Za-zÀ-ÿ'’-]+)+?)";
            const numberPattern = "(\\d+|zero|one|two|three|four|five|six|seven|eight|nine|ten|first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth)";

            function addPlayer(name, country, goals, assists) {
                const goalCount = numberTextToValue(goals);
                if (!name || !country || goalCount === null) return;

                const key = `${normalizeKey(name)}-${normalizeKey(country)}`;
                const existing = players.get(key);
                const assistCount = assists === undefined ? undefined : numberTextToValue(assists);
                const existingAssists = existing?.statistics?.[0]?.goals?.assists;
                const bestAssists = assistCount === undefined && existingAssists == null
                    ? null
                    : Math.max(assistCount ?? 0, Number(existingAssists || 0));
                players.set(key, createOfficialGoldenBootEntry(
                    name.trim(),
                    country.trim(),
                    Math.max(goalCount, Number(existing?.statistics?.[0]?.goals?.total || 0)),
                    bestAssists
                ));
            }

            // Själva tabellen levereras nu som ett dynamiskt embedded-entry-block.
            // Ingressen innehåller dock målantal och FIFA:s officiella ledarordning.
            const leaderMatch = text.match(new RegExp(`^${namePattern}\\s+has returned to the front`, "i"));
            const levelMatch = text.match(new RegExp(`locked on\\s+${numberPattern}\\s+goals?\\s+with\\s+${namePattern}[^.]*?moved ahead`, "i"));
            if (leaderMatch && levelMatch) {
                addPlayer(leaderMatch[1], /lionel messi/i.test(leaderMatch[1]) ? "Argentina" : "-", levelMatch[1]);
                addPlayer(levelMatch[2], /kylian mbapp[eé]/i.test(levelMatch[2]) ? "France" : "-", levelMatch[1]);
            }

            const hyphenGoalPattern = new RegExp(`${numberPattern}-goal\\s+${namePattern}`, "gi");
            for (const match of text.matchAll(hyphenGoalPattern)) {
                addPlayer(match[2], /erling haaland/i.test(match[2]) ? "Norway" : "-", match[1]);
            }

            const duoPattern = text.match(new RegExp(`${countryPattern}\\s+duo\\s+${namePattern}\\s+and\\s+${namePattern}\\s+are on\\s+${numberPattern}`, "i"));
            if (duoPattern) {
                addPlayer(duoPattern[2], duoPattern[1], duoPattern[4]);
                addPlayer(duoPattern[3], duoPattern[1], duoPattern[4]);
            }

            const returnedMatch = text.match(new RegExp(`${countryPattern}\\s+(?:legend|forward|captain|striker|midfielder)?\\s*${namePattern}\\s+has returned[\\s\\S]*?scored\\s+(?:his|her|their)\\s+${numberPattern}(?:st|nd|rd|th)?\\s+goal`, "i"));
            if (returnedMatch) addPlayer(returnedMatch[2], returnedMatch[1], returnedMatch[3]);

            const hasGoalsPattern = new RegExp(`${countryPattern}\\s+(?:legend|forward|captain|striker|midfielder)?\\s*${namePattern},\\s+who has\\s+${numberPattern}\\s+goals?(?:\\s+and\\s+${numberPattern}\\s+assists?)?`, "gi");
            for (const match of text.matchAll(hasGoalsPattern)) {
                addPlayer(match[2], match[1], match[3], match[4]);
            }

            const nowAlsoPattern = new RegExp(`${countryPattern}'?s\\s+${namePattern}\\s+now also on\\s+${numberPattern}`, "gi");
            for (const match of text.matchAll(nowAlsoPattern)) {
                addPlayer(match[2], match[1], match[3]);
            }

            const oneBackPattern = new RegExp(`${countryPattern}\\s+(?:legend|forward|captain|striker|midfielder)?\\s*${namePattern}\\s+is one goal back on\\s+${numberPattern}`, "gi");
            for (const match of text.matchAll(oneBackPattern)) {
                addPlayer(match[2], match[1], match[3]);
            }

            // Brödtexten beskriver placeringen i ordning (ledaren först), även när
            // den inte publicerar alla assist/minuter som krävs för egen sortering.
            return Array.from(players.values());
        }

        function parseOfficialGoldenBootArticle(article) {
            const content = article?.richtext?.content || [];
            const players = [];
            let currentGoals = null;
            let inStandings = false;
            let lastUpdated = "";

            content.forEach(node => {
                const text = richTextToText(node).trim();
                if (!text) return;

                if (/adidas golden boot standings/i.test(text)) {
                    inStandings = true;
                    return;
                }
                if (/adidas golden boot criteria/i.test(text)) {
                    inStandings = false;
                    currentGoals = null;
                    return;
                }
                if (!inStandings) return;

                if (/^last updated/i.test(text)) {
                    lastUpdated = text;
                    return;
                }

                if (/^heading-/.test(node.nodeType)) {
                    currentGoals = goalsFromHeading(text);
                    return;
                }

                if (node.nodeType === "paragraph" && currentGoals !== null) {
                    text.split(/\n+/)
                        .map(line => line.trim())
                        .filter(Boolean)
                        .forEach(line => {
                            const player = parseGoldenBootLine(line, currentGoals);
                            if (player) players.push(player);
                        });
                }
            });

            return {
                players: players.length ? players : parseOfficialLeadPlayers(content),
                lastUpdated,
                source: players.length ? "standings" : "article"
            };
        }

        async function loadOfficialGoldenBootPlayers() {
            const article = await fifaContent(FIFA_GOLDEN_BOOT_ARTICLE_ENDPOINT);
            const parsed = parseOfficialGoldenBootArticle(article);
            if (!parsed.players.length) {
                throw new Error("FIFA-listan kunde inte tolkas.");
            }
            return parsed;
        }

        async function loadLiveTopscorers() {
            let eventPlayers = [];
            try {
                const fixtures = await loadFinishedFixtures();
                eventPlayers = await loadTopscorersFromEvents(fixtures);
                if (eventPlayers.length) {
                    return { players: eventPlayers, source: "events", hasApiPlayers: false };
                }
            } catch (error) {
                console.warn("Kunde inte bygga skytteliga från matchhändelser:", error);
            }

            const apiPlayers = await loadTopscorersFromApi().catch(error => {
                console.warn("Kunde inte hämta färdig skytteliga:", error);
                return [];
            });

            return { players: normalizeTopscorers(apiPlayers), source: "api", hasApiPlayers: true };
        }

        function renderTopscorers(players) {
            const rows = players.slice(0, MAX_PLAYERS).map((item, index) => {
                const player = item.player || {};
                const statistics = item.statistics?.[0] || {};
                const team = item.team || statistics.team || {};
                const goals = statistics.goals?.total ?? 0;
                const assistsValue = statistics.goals?.assists;
                const assists = assistsValue == null ? "-" : assistsValue;
                const penaltiesValue = statistics.penalties?.total ?? statistics.penalty?.scored;
                const penalties = penaltiesValue == null ? "-" : penaltiesValue;
                const minutes = knownMinutes(statistics) === Number.MAX_SAFE_INTEGER ? "-" : statistics.games.minutes;
                const nationality = player.nationality || "-";
                return `
                    <tr>
                        <td class="rank">${index + 1}</td>
                        <td>
                            <div class="player-name">${escapeHtml(player.name || "-")}</div>
                            <div class="player-team">${escapeHtml(team.name || "-")} | ${escapeHtml(nationality)}</div>
                        </td>
                        <td>${goals}</td>
                        <td>${assists}</td>
                        <td>${penalties}</td>
                        <td>${minutes}</td>
                    </tr>
                `;
            }).join("");

            return `
                <table class="topscorers-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Spelare</th>
                            <th>Mål</th>
                            <th>Assist</th>
                            <th>Straffmål</th>
                            <th title="Vid lika mål och assist rankas färre spelade minuter högre enligt FIFA:s Golden Boot-regel.">Minuter*</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        async function loadTopscorers() {
            configureOfficialLink();
            const container = document.getElementById("topscorers");
            const status = document.getElementById("status");

            try {
                const official = await loadOfficialGoldenBootPlayers();
                if (official.players.length) {
                    container.innerHTML = renderTopscorers(official.players);
                    status.textContent = official.source === "standings"
                        ? `Visar ${Math.min(official.players.length, MAX_PLAYERS)} spelare från FIFA:s officiella Golden Boot-lista${official.lastUpdated ? ` (${official.lastUpdated})` : ""}.`
                        : `Visar skyttekungsläget från FIFA:s officiella Golden Boot-sida.`;
                    return;
                }
            } catch (error) {
                console.warn("Kunde inte hämta FIFA:s officiella Golden Boot-sida, provar FIFA-statistik via worker.", error);
            }

            try {
                const fifaStatsPlayers = await loadTopscorersFromFifaStats();
                if (fifaStatsPlayers.length) {
                    container.innerHTML = renderTopscorers(fifaStatsPlayers);
                    status.textContent = `Visar FIFA:s automatiska statistik: mål, assist och spelade minuter.`;
                    return;
                }
            } catch (error) {
                console.warn("Kunde inte hämta FIFA:s automatiska statistik, provar matchhändelser.", error);
            }

            try {
                const live = await loadLiveTopscorers();
                if (live.players.length) {
                    container.innerHTML = renderTopscorers(live.players);
                    status.textContent = live.source === "events"
                        ? `Visar top ${Math.min(live.players.length, MAX_PLAYERS)} räknat från matchhändelser och spelade minuter.`
                        : `Visar top ${Math.min(live.players.length, MAX_PLAYERS)} från API:s skytteliga sorterad på mål, assist och minuter.`;
                    return;
                }
            } catch (error) {
                console.warn("Kunde inte hämta live-skytteliga från API-Football, använder sparad FIFA-fallback.", error);
                try {
                    const fallbackPlayers = FALLBACK_GOLDEN_BOOT_PLAYERS.slice();
                    container.innerHTML = renderTopscorers(fallbackPlayers);
                    status.textContent = `Visar sparad FIFA-lista eftersom varken FIFA eller API-Football svarade.`;
                } catch (fallbackError) {
                    console.error(fallbackError);
                    container.innerHTML = `<div class="error">Kunde inte hämta toppskyttar. Kontrollera API-nyckeln och att tjänsten är tillgänglig.</div>`;
                    status.textContent = "Fel vid hämtning av toppskyttar.";
                }
            }
        }

        loadTopscorers();
        setInterval(loadTopscorers, FIFA_REFRESH_INTERVAL_MS);
    </script>
