<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VM 2026 Skytteliga</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7fb;
            color: #102a43;
        }
        header {
            background: #0f4c81;
            color: #ffffff;
            padding: 22px 18px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: clamp(2rem, 3vw, 2.6rem);
            letter-spacing: 0;
        }
        header p {
            margin: 10px auto 0;
            max-width: 680px;
            color: rgba(255, 255, 255, 0.88);
            line-height: 1.5;
        }
        .container {
            max-width: 880px;
            margin: 24px auto;
            padding: 0 18px 40px;
        }
        .status-box {
            display: inline-flex;
            align-items: center;
            padding: 12px 14px;
            border-radius: 14px;
            background: #e2e8f0;
            color: #102a43;
            font-size: 0.95rem;
            margin-bottom: 18px;
        }
        .note {
            margin: 0 0 18px;
            padding: 16px 18px;
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #dbe3ea;
            color: #334e68;
            line-height: 1.6;
        }
        .topscorer-list {
            display: grid;
            gap: 12px;
        }
        .topscorer-card {
            display: grid;
            grid-template-columns: 48px minmax(0, 1fr) auto;
            gap: 14px;
            align-items: center;
            padding: 16px;
            border-radius: 8px;
            background: #ffffff;
            border: 1px solid #dbe3ea;
            box-shadow: 0 12px 28px rgba(16, 42, 67, 0.08);
        }
        .topscorer-card:first-child {
            border-color: rgba(15, 76, 129, 0.28);
            box-shadow: 0 18px 38px rgba(16, 42, 67, 0.12);
        }
        .rank {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 999px;
            background: #e8f1fb;
            color: #0f4c81;
            font-weight: 900;
        }
        .topscorer-card:first-child .rank {
            background: #f6c945;
            color: #102a43;
        }
        .player-name {
            margin: 0;
            color: #102a43;
            font-size: 1.12rem;
            font-weight: 900;
        }
        .player-team {
            margin-top: 4px;
            color: #4a6d87;
            font-size: 0.95rem;
            font-weight: 700;
        }
        .player-extra {
            margin-top: 6px;
            color: #60758a;
            font-size: 0.9rem;
            line-height: 1.45;
        }
        .goals-pill {
            min-width: 94px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #0f4c81;
            color: #ffffff;
            text-align: center;
        }
        .goals-pill strong {
            display: block;
            font-size: 1.8rem;
            line-height: 1;
        }
        .goals-pill span {
            display: block;
            margin-top: 3px;
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
        }
        .loading,
        .error {
            padding: 16px;
            border-radius: 8px;
            margin-top: 12px;
        }
        .loading {
            background: #ffffff;
            border: 1px solid #dbe3ea;
            color: #334e68;
        }
        .error {
            background: #ffe0e0;
            border: 1px solid #fecaca;
            color: #9f1239;
        }
        @media (max-width: 760px) {
            .topscorer-card {
                grid-template-columns: 42px minmax(0, 1fr);
            }
            .goals-pill {
                grid-column: 1 / -1;
                min-width: 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Skytteliga</h1>
        <p>En enkel topplista över spelarna som gjort flest mål i VM 2026.</p>
    </header>
    <div class="container">
 
        <div class="status-box" id="status">Laddar toppskyttar...</div>
        <div class="note">Listan sorteras på flest mål. Vid lika många mål sorteras spelarna efter flest assist och därefter färre spelade minuter.</div>
        <div id="topscorers">
            <div class="loading">Hämtar data från API...</div>
        </div>
    </div>
    <script>
        const API_KEY = "170d2afb853fb860d9432d14d7eaaaa5"; // ⚠️ Byt ut mot din API-nyckel från api-football.com
        const BASE_URL = "https://v3.football.api-sports.io";
        const LEAGUE = 1;
        const SEASON = 2026;
        const MAX_PLAYERS = 5;
        const FINISHED_STATUSES = new Set(["FT", "AET", "PEN"]);

        async function apiFootball(endpoint) {
            const separator = endpoint.includes("?") ? "&" : "?";
            const response = await fetch(`${BASE_URL}/${endpoint}${separator}_=${Date.now()}`, {
                cache: "no-store",
                headers: {
                    "Cache-Control": "no-cache",
                    "x-apisports-key": API_KEY
                }
            });
            if (!response.ok) {
                const text = await response.text();
                throw new Error(`API-fel ${response.status}: ${response.statusText} ${text}`);
            }
            return response.json();
        }

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char]));
        }

        function personKey(person, team) {
            return String(person.id || `${person.name || ""}-${team.id || team.name || ""}`).toLowerCase();
        }

        function createPlayerEntry(player, team) {
            return {
                player: {
                    id: player.id,
                    name: player.name || "-"
                },
                team: {
                    id: team.id,
                    name: team.name || "-"
                },
                statistics: [{
                    games: { scoringMatches: 0, minutes: 0 },
                    goals: { total: 0, assists: 0 },
                    penalties: { total: 0 },
                    fixtureIds: new Set(),
                    minutesFixtureIds: new Set()
                }]
            };
        }

        async function loadFinishedFixtures() {
            const data = await apiFootball(`fixtures?league=${LEAGUE}&season=${SEASON}`);
            return (data.response || []).filter(match =>
                FINISHED_STATUSES.has(match.fixture?.status?.short)
            );
        }

        async function mapWithConcurrency(items, limit, worker) {
            const queue = [...items];
            const workers = Array.from({ length: Math.min(limit, queue.length) }, async () => {
                while (queue.length) {
                    const item = queue.shift();
                    await worker(item);
                }
            });
            await Promise.all(workers);
        }

        function addPlayerMinutes(entries, fixtureId, team, player, playerStats) {
            if (!player?.name) return;

            const key = personKey(player, team);
            if (!entries.has(key)) {
                entries.set(key, createPlayerEntry(player, team));
            }

            const stats = entries.get(key).statistics[0];
            if (stats.minutesFixtureIds.has(fixtureId)) return;

            const minutes = Number(playerStats.games?.minutes ?? 0);
            stats.games.minutes += Number.isFinite(minutes) ? minutes : 0;
            stats.minutesFixtureIds.add(fixtureId);
        }

        function addGoalEvent(entries, fixtureId, event) {
            const detail = String(event.detail || "");
            const ignoredGoalDetails = ["Missed Penalty", "Own Goal", "Cancelled goal", "Penalty Shootout"];
            if (event.type !== "Goal" || ignoredGoalDetails.includes(detail) || detail.toLowerCase().includes("shootout")) return;

            const player = event.player || {};
            const team = event.team || {};
            if (!player.name) return;

            const key = personKey(player, team);
            if (!entries.has(key)) {
                entries.set(key, createPlayerEntry(player, team));
            }

            const stats = entries.get(key).statistics[0];
            stats.goals.total += 1;
            stats.fixtureIds.add(fixtureId);
            stats.games.scoringMatches = stats.fixtureIds.size;
            if (event.detail === "Penalty") {
                stats.penalties.total += 1;
            }

            const assist = event.assist || {};
            if (assist.name) {
                const assistKey = personKey(assist, team);
                if (!entries.has(assistKey)) {
                    entries.set(assistKey, createPlayerEntry(assist, team));
                }
                const assistStats = entries.get(assistKey).statistics[0];
                assistStats.goals.assists += 1;
            }
        }

        async function addFixturePlayerStatistics(entries, match) {
            const data = await apiFootball(`fixtures/players?fixture=${match.fixture.id}`);
            (data.response || []).forEach(teamStats => {
                const team = teamStats.team || {};
                (teamStats.players || []).forEach(item => {
                    addPlayerMinutes(entries, match.fixture.id, team, item.player || {}, item.statistics?.[0] || {});
                });
            });
        }

        async function addFixtureEvents(entries, match) {
            const data = await apiFootball(`fixtures/events?fixture=${match.fixture.id}`);
            (data.response || []).forEach(event => {
                addGoalEvent(entries, match.fixture.id, event);
            });
        }

        async function loadTopscorersFromEvents(fixtures) {
            const entries = new Map();

            await mapWithConcurrency(fixtures, 2, async match => {
                const [playerStatsResult, eventsResult] = await Promise.allSettled([
                    addFixturePlayerStatistics(entries, match),
                    addFixtureEvents(entries, match)
                ]);

                if (playerStatsResult.status === "rejected") {
                    console.warn(`Kunde inte hämta spelarstatistik för match ${match.fixture.id}:`, playerStatsResult.reason);
                }
                if (eventsResult.status === "rejected") {
                    console.warn(`Kunde inte hämta mål-events för match ${match.fixture.id}:`, eventsResult.reason);
                }
            });

            return Array.from(entries.values()).filter(item =>
                (item.statistics?.[0]?.goals?.total ?? 0) > 0
            ).sort((a, b) => {
                const aStats = a.statistics?.[0] || {};
                const bStats = b.statistics?.[0] || {};
                const goalDiff = (bStats.goals?.total ?? 0) - (aStats.goals?.total ?? 0);
                if (goalDiff) return goalDiff;
                const assistDiff = (bStats.goals?.assists ?? 0) - (aStats.goals?.assists ?? 0);
                if (assistDiff) return assistDiff;
                const aMinutes = aStats.games?.minutes ?? Number.MAX_SAFE_INTEGER;
                const bMinutes = bStats.games?.minutes ?? Number.MAX_SAFE_INTEGER;
                const minutesDiff = aMinutes - bMinutes;
                if (minutesDiff) return minutesDiff;
                return (a.player?.name || "").localeCompare(b.player?.name || "", "sv");
            });
        }

        function renderTopscorers(players) {
            const rows = players.slice(0, MAX_PLAYERS).map((item, index) => {
                const player = item.player || {};
                const team = item.team || {};
                const statistics = item.statistics?.[0] || {};
                const goals = statistics.goals?.total ?? 0;
                const assists = statistics.goals?.assists ?? 0;
                const penalties = statistics.penalties?.total ?? 0;
                const scoringMatches = statistics.games?.scoringMatches ?? 0;
                const detailParts = [
                    `${assists} assist`,
                    `${scoringMatches} målmatch${scoringMatches === 1 ? "" : "er"}`
                ];
                if (penalties > 0) detailParts.push(`${penalties} straffmål`);
                return `
                    <article class="topscorer-card">
                        <div class="rank">${index + 1}</div>
                        <div>
                            <h2 class="player-name">${escapeHtml(player.name || "-")}</h2>
                            <div class="player-team">${escapeHtml(team.name || "-")}</div>
                            <div class="player-extra">${escapeHtml(detailParts.join(" · "))}</div>
                        </div>
                        <div class="goals-pill">
                            <strong>${goals}</strong>
                            <span>mål</span>
                        </div>
                    </article>
                `;
            }).join("");

            return `
                <section class="topscorer-list" aria-label="Skytteligans toppspelare">
                    ${rows}
                </section>
            `;
        }

        async function loadTopscorers() {
            const container = document.getElementById("topscorers");
            const status = document.getElementById("status");
            try {
                const fixtures = await loadFinishedFixtures();
                const players = await loadTopscorersFromEvents(fixtures);
                if (players.length === 0) {
                    container.innerHTML = `<div class="error">Inga topplista-data hittades.</div>`;
                    status.textContent = "Inga toppskyttar hittades.";
                    return;
                }
                container.innerHTML = renderTopscorers(players);
                status.textContent = `Visar topp ${Math.min(players.length, MAX_PLAYERS)} i skytteligan.`;
            } catch (error) {
                console.error(error);
                container.innerHTML = `<div class="error">Kunde inte hämta toppskyttar. Kontrollera API-nyckeln och att tjänsten är tillgänglig.</div>`;
                status.textContent = "Fel vid hämtning av toppskyttar.";
            }
        }

        loadTopscorers();
    </script>
</body>
</html>
