        :root {
            color: #172033;
            background: #eef3f8;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                linear-gradient(135deg, rgba(0, 82, 147, 0.92), rgba(0, 142, 105, 0.86)),

            color: #172033;
        }

        header {
            color: #ffffff;
            padding: 34px 18px 26px;
        }

        .hero {
            width: min(1180px, 94%);
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 22px;
            align-items: end;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 4vw, 3.8rem);
            line-height: 1;
            letter-spacing: 0;
        }

        .lead {
            margin: 14px 0 0;
            max-width: 720px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.65;
        }

        .status-box {
            display: inline-flex;
            align-items: center;
            min-height: 42px;
            padding: 10px 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.94);
            color: #0f2c45;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 14px 34px rgba(15, 44, 69, 0.18);
            white-space: nowrap;
        }

        .container {
            width: min(1180px, 94%);
            margin: 0 auto;
            padding: 0 0 42px;
        }

        .toolbar {
            display: grid;
            grid-template-columns: minmax(220px, 1.2fr) minmax(170px, 0.8fr) minmax(170px, 0.8fr);
            gap: 12px;
            margin: 0 0 16px;
            padding: 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(15, 44, 69, 0.08);
            box-shadow: 0 18px 46px rgba(15, 44, 69, 0.12);
        }

        label {
            display: grid;
            gap: 6px;
            font-size: 12px;
            font-weight: 800;
            color: #3b4b63;
            text-transform: uppercase;
        }

        input,
        select {
            width: 100%;
            min-height: 42px;
            border: 1px solid #cfd9e6;
            border-radius: 8px;
            padding: 9px 11px;
            font: inherit;
            color: #172033;
            background: #ffffff;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .metric {
            padding: 16px;
            border-radius: 8px;
            background: #ffffff;
            border: 1px solid rgba(15, 44, 69, 0.08);
            box-shadow: 0 12px 32px rgba(15, 44, 69, 0.08);
        }

        .metric span {
            display: block;
            color: #657389;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .metric strong {
            display: block;
            margin-top: 8px;
            font-size: 28px;
            color: #0f2c45;
        }

        .day-group {
            margin-top: 18px;
        }

        .day-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 0 0 10px;
            color: #ffffff;
        }

        .day-heading h2 {
            margin: 0;
            font-size: 20px;
        }

        .day-heading span {
            padding: 7px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            font-size: 13px;
            font-weight: 700;
        }

        .matches {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .match-link {
            color: inherit;
            text-decoration: none;
        }

        .match-card {
            height: 100%;
            display: grid;
            gap: 14px;
            padding: 18px;
            border-radius: 8px;
            background: #ffffff;
            border: 1px solid rgba(15, 44, 69, 0.08);
            box-shadow: 0 16px 36px rgba(15, 44, 69, 0.1);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .match-link:hover .match-card {

            box-shadow: 0 22px 48px rgba(15, 44, 69, 0.16);
        }

        .meta-row,
        .fact-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 5px 9px;
            border-radius: 999px;
            background: #eef4fb;
            color: #23435f;
            font-size: 12px;
            font-weight: 800;
        }

        .badge.live {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge.done {
            background: #dcfce7;
            color: #166534;
        }

        .badge.lineup-ready {
            background: #dcfce7;
            color: #166534;
        }

        .badge.tv {
            background: #fef3c7;
            color: #92400e;
        }

        .badge.lineup-waiting {
            background: #fff7ed;
            color: #9a3412;
        }

        .badge.lineup-ready::before,

            content: "";
            width: 8px;
            height: 8px;
            margin-right: 6px;
            border-radius: 999px;
            background: currentColor;
        }

        .kickoff {
            margin-left: auto;
            color: #657389;
            font-size: 13px;
            font-weight: 700;
        }

        .scoreboard {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            gap: 12px;
            align-items: center;
        }

        .team {
            display: grid;
            gap: 6px;
            min-width: 0;
        }

        .team.away {
            text-align: right;

        .team-name {
            font-size: 18px;
            font-weight: 800;

        }

        .team small {

            font-weight: 700;

            border-radius: 8px;
            background: #0f2c45;
            color: #ffffff;
            text-align: center;
            font-size: 26px;
            font-weight: 900;

            border-radius: 8px;

        async function apiFootball(endpoint) {
            const response = await fetch(`${BASE_URL}/${endpoint}`, {
                headers: { "x-apisports-key": API_KEY }
            });

            if (!response.ok) {
                const text = await response.text();
                throw new Error(`API-fel ${response.status}: ${response.statusText} ${text}`);
            }

            return response.json();
        }

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char]));
        }

        function formatDate(dateString, options = {}) {
            return new Intl.DateTimeFormat("sv-SE", {
                weekday: options.weekday || "long",
                year: options.year,
                day: "2-digit",
                month: "2-digit",
                hour: options.hour === false ? undefined : "2-digit",
                minute: options.hour === false ? undefined : "2-digit",
                hour12: false,
                timeZone: "Europe/Stockholm"
            }).format(new Date(dateString));
        }

        function scoreValue(value) {
            return value !== null && value !== undefined ? value : "-";
        }

        function parseGroupTips(text) {
            return text
                .split(/\r?\n/)
                .map(line => line.split(/\t+/).map(value => value.trim()))
                .filter(parts => parts.length >= 4 && parts[0] && parts[1])
                .map(([name, group, first = "", second = ""]) => ({
                    name,
                    group: group.toUpperCase(),
                    first,
                    second
                }));
        }

        function matchState(match) {
            const short = match.fixture.status.short;
            if (["1H", "HT", "2H", "ET", "BT", "P", "SUSP", "INT", "LIVE"].includes(short)) return "live";
            if (["FT", "AET", "PEN"].includes(short)) return "finished";
            return "upcoming";
        }

        function stateLabel(state) {
            if (state === "live") return "Live";
            if (state === "finished") return "Spelad";
            return "Kommande";
        }

        function isLineupCheckWindow(match) {
            const state = matchState(match);
            if (state === "live") return true;
            if (state !== "upcoming") return false;

            const kickoff = new Date(match.fixture.date).getTime();
            if (Number.isNaN(kickoff)) return false;

            const hoursUntilKickoff = (kickoff - Date.now()) / (1000 * 60 * 60);
            return hoursUntilKickoff <= 4 && hoursUntilKickoff >= -1;
        }

        function hasStartingLineups(lineups) {
            return (lineups || []).some(team => (team.startXI || []).length >= 11);
        }

        function lineupBadge(match) {
            const fixtureId = match.fixture.id;
            const knownStatus = lineupStatus.get(fixtureId);

            if (knownStatus === true) {
                return '<span class="badge lineup-ready" title="API-Football har publicerat startelvor">Startelvor klara</span>';
            }

            if (isLineupCheckWindow(match)) {
                return '<span class="badge lineup-waiting" title="Kontrolleras automatiskt inför avspark">Startelvor väntar</span>';
            }

            return "";
        }

            "2026-07-04 00:00": "SVT / SVT Play",
            "2026-07-04 03:30": "SVT / SVT Play",

            "2026-07-15 21:00": "TV4 / TV4 Play",
            "2026-07-18 23:00": "SVT / SVT Play",
            "2026-07-19 21:00": "TV4 / TV4 Play"
        };

        const GROUP_TEAMS = {
            a: ["Mexico", "South Korea", "Czechia", "Czech Republic"],
            b: ["Canada", "Switzerland", "Qatar", "Bosnia and Herzegovina"],
            c: ["Brazil", "Morocco", "Scotland"],
            d: ["USA", "Paraguay", "Australia", "Turkey"],
            e: ["Germany", "Ecuador", "Ivory Coast"],
            f: ["Netherlands", "Japan", "Tunisia", "Sweden"],
            g: ["Belgium", "Iran", "Egypt"],
            h: ["Spain", "Uruguay", "Saudi Arabia"],
            i: ["France", "Senegal", "Norway"],
            j: ["Argentina", "Austria", "Algeria"],
            k: ["Portugal", "Colombia", "Uzbekistan"],
            l: ["England", "Croatia", "Panama", "Ghana"]
        };

        function normalizeSearch(value) {
            return String(value ?? "")
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9]+/g, " ")
                .trim()
                .replace(/\s+/g, " ");
        }

        function canonicalTeamName(value) {
            const normalized = normalizeSearch(value);
            const compact = normalized.replace(/\s+/g, "");

            for (const [team, aliases] of Object.entries(SEARCH_ALIASES)) {
                const terms = [team, ...aliases].map(alias => normalizeSearch(alias));
                const compactTerms = terms.map(term => term.replace(/\s+/g, ""));
                if (terms.includes(normalized) || compactTerms.includes(compact)) {
                    return team;
                }
            }

            return normalized;
        }

        function stockholmDateTimeKey(dateString, includeTime = true) {
            const parts = new Intl.DateTimeFormat("sv-SE", {
                timeZone: "Europe/Stockholm",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: includeTime ? "2-digit" : undefined,
                minute: includeTime ? "2-digit" : undefined,
                hourCycle: "h23"
            }).formatToParts(new Date(dateString));
            const part = type => parts.find(item => item.type === type)?.value;
            const date = `${part("year")}-${part("month")}-${part("day")}`;
            return includeTime ? `${date} ${part("hour")}:${part("minute")}` : date;
        }

        function tvChannelForMatch(match) {
            const dateKey = stockholmDateTimeKey(match.fixture.date, false);
            const timeKey = stockholmDateTimeKey(match.fixture.date, true);
            const home = canonicalTeamName(match.teams.home.name);
            const away = canonicalTeamName(match.teams.away.name);

            const groupMatch = TV_MATCHES.find(([date, homeTeam, awayTeam]) => {
                if (date !== dateKey) return false;
                const expectedHome = canonicalTeamName(homeTeam);
                const expectedAway = canonicalTeamName(awayTeam);
                return (home === expectedHome && away === expectedAway)
                    || (home === expectedAway && away === expectedHome);
            });

            return groupMatch?.[3] || TV_KNOCKOUT_MATCHES[timeKey] || "Ej bekräftad";
        }

        function aliasTerms(value) {
            const normalized = normalizeSearch(value);
            const compact = normalized.replace(/\s+/g, "");
            const aliases = SEARCH_ALIASES[normalized] || SEARCH_ALIASES[compact] || [];
            return [normalized, compact, ...aliases.map(normalizeSearch)];
        }

        function groupTerms(round) {
            const normalized = normalizeSearch(round);
            const match = normalized.match(/\b(?:group|grupp)\s*([a-l])\b/i);
            if (!match) return [];

            const letter = match[1].toLowerCase();
            return [
                `group ${letter}`,
                `group${letter}`,
                `grupp ${letter}`,
                `grupp${letter}`,
                letter
            ];
        }

        function termsForGroupLetter(letter) {
            return [
                `group ${letter}`,
                `group${letter}`,
                `grupp ${letter}`,
                `grupp${letter}`
            ];
        }

        function teamGroupTerms(teamName) {
            const teamTerms = new Set(aliasTerms(teamName));
            const groups = [];

            Object.entries(GROUP_TEAMS).forEach(([letter, teams]) => {
                const groupHasTeam = teams.some(team => aliasTerms(team).some(term => teamTerms.has(term)));
                if (groupHasTeam) {
                    groups.push(...termsForGroupLetter(letter));
                }
            });

            return groups;
        }

        function groupLetterForTeam(teamName) {
            const teamTerms = new Set(aliasTerms(teamName));

            for (const [letter, teams] of Object.entries(GROUP_TEAMS)) {
                const groupHasTeam = teams.some(team => aliasTerms(team).some(term => teamTerms.has(term)));
                if (groupHasTeam) return letter.toUpperCase();
            }

            return "";
        }

        function matchGroupLabel(match) {
            const round = normalizeSearch(match.league.round);
            const roundMatch = round.match(/\b(?:group|grupp)\s*([a-l])\b/i);
            if (roundMatch) return `Grupp ${roundMatch[1].toUpperCase()}`;

            const homeGroup = groupLetterForTeam(match.teams.home.name);
            const awayGroup = groupLetterForTeam(match.teams.away.name);
            if (homeGroup && homeGroup === awayGroup) return `Grupp ${homeGroup}`;
            if (homeGroup || awayGroup) return `Grupp ${homeGroup || awayGroup}`;

            return "Grupp saknas";
        }

        function matchGroupLetter(match) {
            const label = matchGroupLabel(match);
            const groupMatch = label.match(/Grupp\s*([A-L])/i);
            return groupMatch ? groupMatch[1].toUpperCase() : "";
        }

        function buildTipSummary(match) {
            const group = matchGroupLetter(match);
            if (!group || !tipImpactRows.length) {
                return {
                    favorite: "Tipsdata saknas",
                    challenger: "Tipsdata saknas",
                    selected: ""
                };
            }

            const selectedName = localStorage.getItem(PROFILE_KEY) || "";
            const groupRows = tipImpactRows.filter(row => row.group === group);

            function statsFor(teamName) {
                const aliases = new Set(aliasTerms(teamName));
                const winnerNames = groupRows
                    .filter(row => aliasTerms(row.first).some(term => aliases.has(term)))
                    .map(row => row.name);
                const topTwoNames = groupRows
                    .filter(row =>
                        aliasTerms(row.first).some(term => aliases.has(term)) ||
                        aliasTerms(row.second).some(term => aliases.has(term))
                    )
                    .map(row => row.name);
                return { winnerNames, topTwoNames };
            }

            const teams = [
                { name: match.teams.home.name, ...statsFor(match.teams.home.name) },
                { name: match.teams.away.name, ...statsFor(match.teams.away.name) }
            ].sort((a, b) =>
                b.topTwoNames.length - a.topTwoNames.length ||
                b.winnerNames.length - a.winnerNames.length ||
                a.name.localeCompare(b.name, "sv")
            );

            const selectedRow = groupRows.find(row => row.name === selectedName);
            const selected = selectedRow
                ? `${selectedRow.first || "-"} som gruppvinnare, ${selectedRow.second || "-"} som tvåa`
                : selectedName ? "Inget tips hittat för vald deltagare" : "Välj deltagare i Min vy";

            return {
                favorite: `${teams[0].name} är tipsfavorit (${teams[0].topTwoNames.length} har laget topp 2)`,
                challenger: `${teams[1].name}: ${teams[1].topTwoNames.length} topp 2, ${teams[1].winnerNames.length} som gruppvinnare`,
                selected
            };
        }

        function searchableText(match) {
            const tvChannel = tvChannelForMatch(match);
            const fields = [
                match.teams.home.name,
                match.teams.away.name,
                match.fixture.venue?.name,
                match.fixture.venue?.city,
                match.league.round,
                match.league.name,
                match.fixture.referee,
                tvChannel
            ];

            return [
                ...fields.map(normalizeSearch),
                ...aliasTerms(match.teams.home.name),
                ...aliasTerms(match.teams.away.name),
                ...groupTerms(match.league.round),
                ...teamGroupTerms(match.teams.home.name),
                ...teamGroupTerms(match.teams.away.name)
            ].join(" ");
        }

        function updateSummary(matches) {
            const venues = new Set(matches.map(match => match.fixture.venue?.name).filter(Boolean));
            document.getElementById("totalMatches").textContent = matches.length;
            document.getElementById("upcomingMatches").textContent = matches.filter(match => matchState(match) === "upcoming").length;
            document.getElementById("finishedMatches").textContent = matches.filter(match => matchState(match) === "finished").length;
            document.getElementById("venueCount").textContent = venues.size;
        }

        function buildMatchCard(match) {
            const state = matchState(match);
            const home = match.teams.home;
            const away = match.teams.away;
            const fixture = match.fixture;
            const venue = fixture.venue?.name || "Arena saknas";
            const city = fixture.venue?.city || "Stad saknas";
            const referee = fixture.referee || "Domare ej utsedd";
            const elapsed = fixture.status.elapsed ? `${fixture.status.elapsed} min` : "Ej startad";
            const group = matchGroupLabel(match);
            const tipSummary = buildTipSummary(match);
            const tvChannel = tvChannelForMatch(match);
            const fixtureId = fixture.id;
            const href = `FIFA2026-match-details.html?fixture=${fixtureId}&home=${home.id}&away=${away.id}&back=FIFA2026-matcher-plus.html`;

            return `
                <a class="match-link" href="${href}">
                    <article class="match-card">
                        <div class="match-topline">
                            <span class="badge ${state === "live" ? "live" : state === "finished" ? "done" : ""}">${stateLabel(state)}</span>
                            <span class="badge">${escapeHtml(group)}</span>
                            <span class="badge">${escapeHtml(roundLabel(match))}</span>
                            <span class="badge tv">${escapeHtml(tvChannel)}</span>
                            ${lineupBadge(match)}
                            <span class="kickoff">${escapeHtml(formatDate(fixture.date))}</span>
                        </div>

                        <div class="scoreboard">
                            <div class="team">
                                <div class="team-name">${escapeHtml(home.name)}</div>
                                <small>Hemmalag</small>
                            </div>
                            <div class="score">${scoreValue(match.goals.home)} - ${scoreValue(match.goals.away)}</div>
                            <div class="team away">
                                <div class="team-name">${escapeHtml(away.name)}</div>
                                <small>Bortalag</small>
                            </div>
                        </div>

                        <div class="meta-row">
                            <span>${escapeHtml(venue)}, ${escapeHtml(city)}</span>
                        </div>

                        <div class="fact-grid">
                            <div class="fact"><span>Status</span><strong>${escapeHtml(fixtureStatusLabel(fixture.status))}</strong></div>
                            <div class="fact"><span>TV-kanal</span><strong>${escapeHtml(tvChannel)}</strong></div>
                            <div class="fact"><span>Grupp</span><strong>${escapeHtml(group)}</strong></div>
                            <div class="fact"><span>Tipsfavorit</span><strong>${escapeHtml(tipSummary.favorite)}</strong></div>
                            <div class="fact"><span>Utmanare</span><strong>${escapeHtml(tipSummary.challenger)}</strong></div>
                            <div class="fact"><span>Ditt tips</span><strong>${escapeHtml(tipSummary.selected)}</strong></div>
                            <div class="fact"><span>Spelminut</span><strong>${escapeHtml(elapsed)}</strong></div>
                            <div class="fact"><span>Domare</span><strong>${escapeHtml(referee)}</strong></div>
                        </div>
                    </article>
                </a>
            `;
        }

        function groupByDay(matches) {
            return matches.reduce((groups, match) => {
                const key = formatDate(match.fixture.date, { hour: false, year: "numeric" });
                groups[key] = groups[key] || [];
                groups[key].push(match);
                return groups;
            }, {});
        }

        function renderMatches() {
            const container = document.getElementById("matches");
            const search = normalizeSearch(document.getElementById("searchInput").value);
            const statusFilter = document.getElementById("statusFilter").value;
            const sortOrder = document.getElementById("sortOrder").value;

            let matches = allMatches.filter(match => {
                const matchesSearch = !search || searchableText(match).includes(search);
                const state = matchState(match);
                const matchesStatus = statusFilter === "all"
                    || state === statusFilter
                    || (statusFilter === "active" && ["live", "upcoming"].includes(state));
                return matchesSearch && matchesStatus;
            });

            matches = matches.sort((a, b) => {
                if (statusFilter === "active") {
                    const statePriority = { live: 0, upcoming: 1 };
                    const stateDiff = statePriority[matchState(a)] - statePriority[matchState(b)];
                    if (stateDiff !== 0) return stateDiff;
                }

                const diff = new Date(a.fixture.date) - new Date(b.fixture.date);
                return sortOrder === "desc" ? -diff : diff;
            });

            updateSummary(matches);

            if (!matches.length) {
                container.innerHTML = `<div class="empty">Inga matcher matchar filtret.</div>`;
                return;
            }

            const grouped = groupByDay(matches);
            container.innerHTML = Object.entries(grouped).map(([day, dayMatches]) => `
                <section class="day-group">
                    <div class="day-heading">
                        <h2>${escapeHtml(day)}</h2>
                        <span>${dayMatches.length} matcher</span>
                    </div>
                    <div class="matches">
                        ${dayMatches.map(buildMatchCard).join("")}
                    </div>
                </section>
            `).join("");

            updateLineupStatuses(matches);
        }

        async function updateLineupStatuses(matches) {
            const now = Date.now();
            const candidates = matches
                .filter(match => isLineupCheckWindow(match))
                .filter(match => lineupStatus.get(match.fixture.id) !== true)
                .filter(match => now - (lineupCheckedAt.get(match.fixture.id) || 0) > LINEUP_RECHECK_MS)
                .slice(0, 12);

            if (!candidates.length) return;

            await Promise.all(candidates.map(async match => {
                lineupCheckedAt.set(match.fixture.id, Date.now());
                try {
                    const data = await apiFootball(`fixtures/lineups?fixture=${match.fixture.id}`);
                    lineupStatus.set(match.fixture.id, hasStartingLineups(data.response));
                } catch (error) {
                    console.warn("Kunde inte kontrollera startelvor:", match.fixture.id, error);
                    lineupStatus.set(match.fixture.id, false);
                }
            }));

            renderMatches();

            if (candidates.some(match => lineupStatus.get(match.fixture.id) !== true) && !lineupRefreshTimer) {
                lineupRefreshTimer = window.setTimeout(() => {
                    lineupRefreshTimer = null;
                    renderMatches();
                }, LINEUP_RECHECK_MS);
            }
        }

        async function loadMatches() {
            const container = document.getElementById("matches");
            const statusBox = document.getElementById("status");

            try {
                const [data, tipsResponse] = await Promise.all([
                    apiFootball(`fixtures?league=${LEAGUE}&season=${SEASON}`),
                    fetch("grupptips.txt", { cache: "no-store" })
                ]);
                if (tipsResponse.ok) {
                    tipImpactRows = parseGroupTips(await tipsResponse.text());
                }
                allMatches = data.response || [];

                if (!allMatches.length) {
                    container.innerHTML = `<div class="error">Inga matcher hittades för VM 2026.</div>`;
                    statusBox.textContent = "Ingen data hittad.";
                    updateSummary([]);
                    return;
                }

                renderMatches();
                statusBox.textContent = `Visar data för ${allMatches.length} matcher.`;
            } catch (error) {
                console.error(error);
                container.innerHTML = `<div class="error">Kunde inte hämta matcher. Kontrollera API-nyckeln och att api-football är tillgängligt.</div>`;
                statusBox.textContent = "Fel vid hämtning av matcher.";
                updateSummary([]);
            }
        }

        document.getElementById("searchInput").addEventListener("input", renderMatches);
        document.getElementById("statusFilter").addEventListener("change", renderMatches);
        document.getElementById("sortOrder").addEventListener("change", renderMatches);
        window.addEventListener("message", event => {
            if (event.origin !== window.location.origin) return;
            if (event.data?.type !== "vm2026:selectedParticipant") return;
            localStorage.setItem(PROFILE_KEY, event.data.name || "");
            renderMatches();
        });

        loadMatches();
    </script>
